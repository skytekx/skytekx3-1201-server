org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false

# Mod Info. The mod id stays upstream's. mod_version names the upstream 1.21.1 release that this
# 1.20.1 Forge port follows (0.1.4) plus the suffix of the unofficial SkyTekx build.
mod_id=expandeddelight
mod_name=Expanded Delight
mod_version=0.1.4-skytekx.1
mod_license=MIT, see LICENSE-MIT_expandeddelight, LICENSE_expandeddelight and NOTICE_expandeddelight
mod_authors=ianm1647
mod_description=Gradually expands upon the already amazing Farmers Delight
group_name=ianm1647.expandeddelight

# Mappings: same as ../skytekx-defixes, ../spiced-twilight and ../twilightforest so the Forge and Minecraft caches are shared
mapping_channel=parchment
mapping_version=2023.07.30-1.20.1

# Minecraft
minecraft_version=1.20.1

# Forge 47 (NeoForged 1.20.1 artifact, same as ../skytekx-defixes). The pack runs Forge 47.4.18.
neo_version=47.1.70

# Farmer's Delight, the required dependency: the exact file of the pack's modrinth.index.json, fetched
# from the Modrinth CDN (https://cdn.modrinth.com/data/<project>/versions/<version>/<file>.jar) and checked
# against this SHA-1. mods.toml requires this build or a newer one, because no older 1.20.1 build was tested.
fd_version=1.20.1-1.3.4
fd_project=R2OftAxM
fd_cdn_version=SiIpcZzM
fd_file=FarmersDelight-1.20.1-1.3.4
fd_sha1=26f615fd35f652021f5b0f1cba68afa7d578fe15

# JEI API for the optional JEI plugin (compile only), same as ../createaddition
jei_minecraft_version=1.20.1
jei_version=15.20.0.106

# KubeJS for the optional recipe schema (compile only): the exact files of the pack's index
kubejs_project=umyGl7zF
kubejs_cdn_version=hVR2xUSr
kubejs_file=kubejs-forge-2001.6.5-build.26
kubejs_sha1=8b0cc9797d4ed00fd2d1002d58960af8b32012ae
rhino_project=sk9knFPE
rhino_cdn_version=uNALdylI
rhino_file=rhino-forge-2001.2.3-build.10
rhino_sha1=c83c9b719a6bab33fbd2b3f2f680eb3adbfc1aa1
architectury_project=lhGA9TYQ
