// SkyTekx: Forge 1.20.1 build of the port. Upstream builds for NeoForge 1.21.1 with ModDevGradle 2.0.141
// on Gradle 9.5 and Java 21. This build uses ForgeGradle 6.0.6 on Gradle 8.1.1 and Java 17 like the other
// Create addon forks in ports/, against Create 6.0.8 for 1.20.1. See UPSTREAM.md for every change.
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: "${forgegradle_version}", changing: true
        classpath "org.parchmentmc:librarian:${librarian_version}"
        classpath "org.spongepowered:mixingradle:${mixingradle_version}"
    }
}

apply plugin: 'java-library'
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'org.spongepowered.mixin'

// SkyTekx: the jar is create-integrated-farming-1.20.1-1.4.3-skytekx.1.jar. mods.toml carries mod_version.
version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_artifact_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// SkyTekx: only the integrations of mods that the SkyTekx pack carries are ported. lavafishing is a
// SkyTekx addition (the pack's lava fishing mod, which upstream has no integration for).
def allIntegrationSourceSets = [
        "farmersdelight",
        "supplementaries",
        "twilightdelight",
        "lavafishing",
]

def integrationSourceSetDependencies = [
        twilightdelight: ["farmersdelight"],
]

sourceSets {
    allIntegrationSourceSets.each { name ->
        create(name) {
            java {
                srcDir "src/integration/${name}/java"
            }
            resources {
                srcDir "src/integration/${name}/resources"
            }
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            integrationSourceSetDependencies.get(name, []).each { dependencyName ->
                compileClasspath += sourceSets[dependencyName].output + sourceSets[dependencyName].compileClasspath
            }
        }
    }
}

configurations {
    allIntegrationSourceSets.each { name ->
        def localConfig = create("${name}LocalImplementation") {
            canBeConsumed = false
            canBeResolved = false
        }
        named("${name}CompileClasspath") {
            extendsFrom localConfig
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

minecraft {
    mappings channel: 'parchment', version: "${parchment_version}-${minecraft_version}"
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    // SkyTekx: no run configurations. The port is tested on a plain Forge server, see UPSTREAM.md.
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.tterrag.com" } // Registrate
    maven { url = "https://maven.blamejared.com" } // JEI
    maven {
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false })
    implementation(fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"))
    compileOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}"))
    implementation(fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}"))
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixin_extras_version}"))
    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"

    // Create: Dragons Plus 1.11.9 for Forge 1.20.1, the Modrinth file of the pack's index entry
    implementation(fg.deobf("maven.modrinth:${create_dragons_plus_project}:${create_dragons_plus_file}"))

    compileOnly(fg.deobf("mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_version}"))
    compileOnly(fg.deobf("mezz.jei:jei-${jei_minecraft_version}-forge-api:${jei_version}"))

    farmersdelightLocalImplementation(fg.deobf("maven.modrinth:${farmers_delight_project}:${farmers_delight_file}"))
    supplementariesLocalImplementation(fg.deobf("maven.modrinth:${moonlight_project}:${moonlight_file}"))
    supplementariesLocalImplementation(fg.deobf("maven.modrinth:${supplementaries_project}:${supplementaries_file}"))
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version                : minecraft_version,
            minecraft_version_range          : minecraft_version_range,
            forge_version_range              : forge_version_range,
            loader_version_range             : loader_version_range,
            mod_id                           : mod_id,
            mod_name                         : mod_name,
            mod_license                      : mod_license,
            mod_version                      : mod_version,
            mod_authors                      : mod_authors,
            mod_credits                      : mod_credits,
            mod_description                  : mod_description,
            mod_github                       : mod_github,
            mod_issues                       : mod_issues,
            mod_logo                         : mod_logo,
            create_version_range             : create_version_range,
            create_dragons_plus_version_range: create_dragons_plus_version_range,
            farmers_delight_version_range    : farmers_delight_version_range,
            supplementaries_version_range    : supplementaries_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata

tasks.named("jar", Jar) {
    allIntegrationSourceSets.each { name ->
        from sourceSets[name].output
    }
    // SkyTekx: LGPL 3(b) and 4(b) ask for the GPL and the LGPL texts with the object code (upstream's
    // LICENSE.txt holds both). LICENSE-CREATE.txt is Create's MIT notice for the parts taken from Create,
    // and NOTICE says that this is a modified, unofficial build and where its source is.
    from "LICENSE.txt"
    from "LICENSE-CREATE.txt"
    from "NOTICE"
    exclude ".cache"
    // SkyTekx: byte-reproducible jar, so a rebuild of a commit can be checked against the recorded SHA-1
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest {
        attributes([
                "Specification-Title"   : mod_id,
                "Specification-Vendor"  : mod_authors,
                "Specification-Version" : "1",
                "Implementation-Title"  : project.name,
                "Implementation-Version": project.version,
                "Implementation-Vendor" : "${mod_authors} (modified build: SkyTekx)",
                "MixinConfigs"          : "${mod_id}.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

// SkyTekx: reobfJar maps a call to an inherited vanilla method through the class hierarchy of its owner,
// so it needs the integration targets on its library path too. Without them a call such as
// TomatoBlock#getAge keeps its Mojang name and fails with a NoSuchMethodError at runtime.
reobf {
    jar {
        allIntegrationSourceSets.each { name ->
            libraries.from(sourceSets[name].compileClasspath)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
