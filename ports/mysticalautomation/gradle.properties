# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
# SkyTekx: no daemon, no build cache and no configuration cache, as in the other ports, so a build
# always starts from the sources of the checkout
org.gradle.daemon=false

# SkyTekx: the 1.20.1 Forge port of upstream 1.0.8 plus the suffix of the unofficial build. The jar is
# MysticalAutomation-1.20.1-1.0.8-skytekx.1.jar
mod_version=1.0.8-skytekx.1

minecraft_version=1.20.1
# Forge 47.4.0 and Parchment 2023.06.26 are what ../createaddition and ../littletiles use, so the
# ForgeGradle caches are shared. The pack runs Forge 47.4.18.
forge_version=47.4.0
parchment_version=2023.06.26

# The builds of the pack (modrinth.index.json). maven.blakesmods.com serves the same files as the
# Modrinth CDN (SHA-1 checked by verifyPackJars in build.gradle).
cucumber_version=1.20.1-7.0.16
cucumber_sha1=88a9ec30e4acb5c80a3ae060ad70b79e945293c6
mysticalagriculture_version=1.20.1-7.0.24
mysticalagriculture_sha1=e8839d207456a47ed6a576469901a087319b505f
mysticalagradditions_version=1.20.1-7.0.12
mysticalagradditions_sha1=b4fcc78796a6e1f637523298cf7b3fe7f1dd3ed9
# JEI of the pack. Only its API is on the compile classpath.
jei_version=15.74.0.233
jei_mc_version=1.20.1
