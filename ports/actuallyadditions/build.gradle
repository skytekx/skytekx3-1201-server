plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    // SkyTekx: pinned to the versions that upstream's ranges '[6.0,6.2)' and '1.+' resolve to
    // today, so a new plugin release cannot change the build
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0.7-dev-SNAPSHOT'
    // SkyTekx: Mixin for the mixins of the newer upstream lines, pinned like ports/littletiles
    // and ports/skytekx-defixes
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = "$mod_version"
group = "de.ellpeck.actuallyadditions"
base {
    archivesName = "ActuallyAdditions-$game_version"
}

// SkyTekx: upstream appended the Jenkins BUILD_NUMBER here. The fork's version comes from
// mod_version alone, so a CI variable cannot change the jar name or the mod version

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// SkyTekx: the dev only test mod aadevtest (src/devtest), which drives the server safety tests of
// the backport from a dev client against a dedicated server. Only the client dev run loads it.
// The jar task packs sourceSets.main alone, so the mod jar never contains it
sourceSets {
    devtest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'parchment', version: "${parchment_version}-${game_version}"
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        // SkyTekx: dev runs remap the refmaps of the mixins in the deobfuscated mod jars
        configureEach {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        client {
            workingDirectory project.file('run')
        
            mods {
                actuallyadditions {
                    source sourceSets.main
                }
                // SkyTekx: the dev only test mod, see sourceSets.devtest
                aadevtest {
                    source sourceSets.devtest
                }
            }
        }

        server {
            workingDirectory project.file('run')
            mods {
                actuallyadditions {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            args '--mod', 'actuallyadditions', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                actuallyadditions {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// SkyTekx: Forge 47 reads mixin configs from the jar manifest (MixinConfigs, see the jar task),
// not from a [[mixins]] block in mods.toml as the NeoForge lines do
mixin {
    add sourceSets.main, 'actuallyadditions.refmap.json'
    config 'actuallyadditions.mixins.json'
}

// SkyTekx: the data generator keeps its hash cache in src/generated/resources/.cache, which is
// build state and not a resource. Upstream jars carry its 18 files at the jar root
processResources {
    exclude '.cache/**'
}

repositories {
    maven {
        url = "https://maven.blamejared.com"
    }
    maven {
        url = "https://www.cursemaven.com"
    }
    // SkyTekx: Curios, as upstream a5563774 has it
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${game_version}-${forge_version}"

    compileOnly fg.deobf("mezz.jei:jei-${game_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${game_version}-forge-api:${jei_version}")

    runtimeOnly fg.deobf("mezz.jei:jei-${game_version}-forge:${jei_version}")

    // SkyTekx: the integrations of the newer upstream lines (654465b3, a5563774). Patchouli comes
    // as the full jar, because the manual's reconstructor page extends a Patchouli client class
    // that is not part of its API. Curios only needs its API at compile time
    compileOnly fg.deobf("vazkii.patchouli:Patchouli:${patchouli_version}")
    runtimeOnly fg.deobf("vazkii.patchouli:Patchouli:${patchouli_version}")
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    runtimeOnly fg.deobf("curse.maven:the-one-probe-245211:4629624")
    runtimeOnly fg.deobf("curse.maven:mekanism-268560:5125665")
}

