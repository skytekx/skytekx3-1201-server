[[dependencies.actuallyadditions]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.actuallyadditions]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"

# SkyTekx: the integrations of the newer upstream lines. All three stay optional, as upstream
# has them (only its Modrinth and CurseForge pages mark Patchouli as required). Forge checks the
# version range of each one that is present. That is their only effect, since the mod list of
# Forge 47 shows no dependencies
[[dependencies.actuallyadditions]]
    modId="patchouli"
    mandatory=false
    versionRange="[1.20.1-81,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.actuallyadditions]]
    modId="curios"
    mandatory=false
    # SkyTekx: 5.2.0+1.20.1 is the first Curios with CuriosApi.getCuriosInventory and
    # ICuriosItemHandler.findFirstCurio, which CuriosCompat calls, and the betas before it lack them
    versionRange="[5.2.0+1.20.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.actuallyadditions]]
    modId="jei"
    mandatory=false
    versionRange="[15.0,)"
    ordering="NONE"
    side="BOTH"
