org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false

minecraft_version=1.20.1
mod_id=mekanism_extra_modules
mod_name=Mekanism: Extra Modules
mod_license=LGPL-3.0-or-later
# Upstream 0.1.0-beta.3 (tag v1.21.1-0.1.0-beta.3), ported to Forge 1.20.1 by SkyTekx
mod_version=0.1.0-beta.3-skytekx.1
mod_group_id=com.github.mekanismextramodules
mod_description=Expands Mekanism's modular gear with additional abilities and protection.

# Mappings: same as ../skytekx-defixes and ../twilightforest so the Forge and Minecraft caches are shared
mapping_channel=parchment
mapping_version=2023.07.30-1.20.1

# Forge 47 (NeoForged 1.20.1 artifact, same as ../skytekx-defixes). The pack runs Forge 47.4.18.
neo_version=47.1.70
mixin_version=0.8.5

# Version ranges in mods.toml. The module API calls are written against Mekanism 10.4.16, the last
# 1.20.1 line. The Draconic Evolution mixin is checked against 3.1.2.621, the build the pack ships.
mekanism_range=[10.4.16,10.5)
de_range=[3.1.2,)

