plugins {
    id 'eclipse'
    id 'idea'
    // Pinned to the versions that ../skytekx-defixes uses, so a rebuild cannot pick a newer plugin release
    // with other reobf output. Librarian has no release, only this snapshot. The port has no mixin, see
    // UPSTREAM.md, so it needs no MixinGradle.
    id 'net.neoforged.gradle' version '6.0.21'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0.7-dev-SNAPSHOT'
}

version = project.mod_version
group = project.group_name

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'fml.earlyprogresswindow', 'false'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            taskName "Minecraft_Client_${project.minecraft_version}"
        }

        server {
            taskName "Minecraft_Server_${project.minecraft_version}"
            args '--nogui'
        }
    }
}

// Upstream keeps its datagen output in src/generated/resources. This port converted that output to the
// 1.20.1 formats by hand and keeps it there, see UPSTREAM.md. The datagen classes are not ported.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Jars of the pack's modrinth.index.json, as the exact files. Modrinth CDN layout:
// https://cdn.modrinth.com/data/<project>/versions/<version>/<file>.jar, coordinates here <project>:<file>:<version>.
def packJars = [
        [name: "Farmer's Delight", coord: "${fd_project}:${fd_file}:${fd_cdn_version}", sha1: fd_sha1, scope: 'implementation'],
        [name: 'KubeJS', coord: "${kubejs_project}:${kubejs_file}:${kubejs_cdn_version}", sha1: kubejs_sha1, scope: 'compileOnly'],
        [name: 'Rhino', coord: "${rhino_project}:${rhino_file}:${rhino_cdn_version}", sha1: rhino_sha1, scope: 'compileOnly'],
        [name: 'Architectury', coord: "${architectury_project}:${architectury_file}:${architectury_cdn_version}", sha1: architectury_sha1, scope: 'compileOnly'],
]

repositories {
    ivy {
        name = 'Modrinth CDN'
        url = 'https://cdn.modrinth.com/data/'
        patternLayout {
            artifact '[organisation]/versions/[revision]/[artifact].[ext]'
        }
        metadataSources { artifact() }
        content {
            packJars.each { includeGroup it.coord.split(':')[0] }
        }
    }
    maven {
        name = "Jared's Maven" // JEI
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
        }
    }
}

configurations {
    // the raw (not deobfuscated) pack jars, only used to check their SHA-1
    packJarsRaw { transitive = false }
}

dependencies {
    minecraft "net.neoforged:forge:${project.minecraft_version}-${project.neo_version}"

    packJars.each {
        add(it.scope, fg.deobf(it.coord))
        packJarsRaw it.coord
    }

    // compile against the JEI API only, the pack brings JEI itself
    compileOnly fg.deobf("mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${jei_minecraft_version}-forge-api:${jei_version}")
}

def verifyPackJars = tasks.register('verifyPackJars') {
    description = 'Checks that the pack dependencies are byte identical to the jars of modrinth.index.json.'
    inputs.files(configurations.packJarsRaw)
    doLast {
        def artifacts = configurations.packJarsRaw.resolvedConfiguration.resolvedArtifacts
        packJars.each { jar ->
            def (group, module, cdnVersion) = jar.coord.split(':')
            def artifact = artifacts.find { it.moduleVersion.id.group == group && it.moduleVersion.id.name == module }
            if (artifact == null) {
                throw new GradleException("${jar.name}: ${module}.jar was not resolved")
            }
            def sha1 = java.security.MessageDigest.getInstance('SHA-1').digest(artifact.file.bytes).encodeHex().toString()
            if (sha1 != jar.sha1) {
                throw new GradleException("${jar.name}: ${module}.jar has SHA-1 ${sha1}, expected ${jar.sha1} (gradle.properties)")
            }
            logger.lifecycle("${jar.name}: ${module}.jar (Modrinth ${group}/${cdnVersion}) SHA-1 ${sha1} OK")
        }
    }
}

tasks.named('compileJava') { dependsOn verifyPackJars }

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            mod_version    : project.mod_version,
            mod_id         : project.mod_id,
            mod_name       : project.mod_name,
            mod_license    : project.mod_license,
            mod_authors    : project.mod_authors,
            mod_description: project.mod_description,
            fd_version     : project.fd_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    // byte-reproducible jar, so the SHA-1 in modrinth-permissions/ can be checked against a rebuild
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    // MIT asks for the notice in every copy: Expanded Delight's own MIT text, the CC0 text of its 1.20
    // branch, Farmer's Delight's MIT text for the parts derived from it, the MDK template license and
    // the notice of this modified build
    from('LICENSE-MIT') {
        rename { "LICENSE-MIT_${project.mod_id}" }
    }
    from('LICENSE') {
        rename { "LICENSE_${project.mod_id}" }
    }
    from('LICENSE_farmersdelight')
    from('TEMPLATE_LICENSE.txt') {
        rename { "TEMPLATE_LICENSE_${project.mod_id}.txt" }
    }
    from('NOTICE') {
        rename { "NOTICE_${project.mod_id}" }
    }
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : 'ianm1647',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'ianm1647 (modified build: SkyTekx)',
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
