plugins {
    id 'eclipse'
    id 'idea'
    // SkyTekx: upstream builds with NeoForge ModDevGradle 2.0.83 for NeoForge 21.1. The 1.20.1 port uses
    // ForgeGradle and Librarian, pinned to the versions that ../actuallyadditions and ../enderio use, so
    // a new plugin release cannot change the build
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0.7-dev-SNAPSHOT'
}

// SkyTekx: upstream's version form '<minecraft>-<mod>', so the jar is
// MysticalAutomation-1.20.1-1.0.8-skytekx.1.jar
version = "${minecraft_version}-${mod_version}"
group = 'com.blakebr0.mysticalautomation'

base {
    archivesName = 'MysticalAutomation'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: 'parchment', version: "${parchment_version}-${minecraft_version}"

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                mysticalautomation {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            args '--nogui'
        }
    }
}

repositories {
    maven { url 'https://maven.blakesmods.com' }
    maven { url 'https://maven.blamejared.com' }
}

configurations {
    // SkyTekx: the raw (not deobfuscated) jars of the pack, only used to check their SHA-1
    packJarsRaw { transitive = false }
}

// SkyTekx: the dependencies are the exact builds of the pack's modrinth.index.json
def packJars = [
        [name: 'Cucumber', coord: "com.blakebr0.cucumber:Cucumber:${cucumber_version}", sha1: cucumber_sha1],
        [name: 'Mystical Agriculture', coord: "com.blakebr0.mysticalagriculture:MysticalAgriculture:${mysticalagriculture_version}", sha1: mysticalagriculture_sha1],
        [name: 'Mystical Agradditions', coord: "com.blakebr0.mysticalagradditions:MysticalAgradditions:${mysticalagradditions_version}", sha1: mysticalagradditions_sha1],
]

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    packJars.each {
        implementation fg.deobf(it.coord)
        packJarsRaw it.coord
    }

    compileOnly fg.deobf("mezz.jei:jei-${jei_mc_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${jei_mc_version}-forge-api:${jei_version}")
}

def verifyPackJars = tasks.register('verifyPackJars') {
    description = 'Checks that the compile dependencies are byte identical to the jars of modrinth.index.json.'
    inputs.files(configurations.packJarsRaw)
    doLast {
        def artifacts = configurations.packJarsRaw.resolvedConfiguration.resolvedArtifacts
        packJars.each { jar ->
            def (group, module, ver) = jar.coord.split(':')
            def artifact = artifacts.find { it.moduleVersion.id.group == group && it.moduleVersion.id.name == module }
            if (artifact == null) {
                throw new GradleException("${jar.name}: ${module} ${ver} was not resolved")
            }
            def sha1 = java.security.MessageDigest.getInstance('SHA-1').digest(artifact.file.bytes).encodeHex().toString()
            if (sha1 != jar.sha1) {
                throw new GradleException("${jar.name}: ${module} ${ver} has SHA-1 ${sha1}, expected ${jar.sha1} (gradle.properties)")
            }
            logger.info("${jar.name}: ${module} ${ver} SHA-1 ${sha1} OK")
        }
    }
}

tasks.named('compileJava') { dependsOn verifyPackJars }

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            mod_version                  : mod_version,
            cucumber_version             : cucumber_version.split('-').last(),
            mysticalagriculture_version  : mysticalagriculture_version.split('-').last(),
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    // SkyTekx: byte-reproducible jar (no file timestamps, fixed entry order, no build timestamp in the
    // manifest), so a rebuild of the same commit can be checked against the SHA-1 in modrinth-permissions/
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    // SkyTekx: MIT asks for the license text in every copy, and upstream jars carry none. The NOTICE
    // says that this is a modified, unofficial build and where its source is
    from('LICENSE') {
        rename { 'LICENSE_mysticalautomation' }
    }
    from('NOTICE') {
        rename { 'NOTICE_mysticalautomation' }
    }
    // SkyTekx: the port carries code from Cucumber 8 and strings from Mystical Agriculture 8 (UPSTREAM.md), both
    // MIT ("Copyright (c) 2018 BlakeBr0"), so their notices ship too
    from('LICENSE-Cucumber')
    from('LICENSE-MysticalAgriculture')
    manifest {
        attributes([
                'Specification-Title'   : 'mysticalautomation',
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : 'Mystical Automation (modified build: SkyTekx)',
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
