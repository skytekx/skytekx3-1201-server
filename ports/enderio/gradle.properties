# Setup gradle memory
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Minecraft and Forge
minecraft_version=1.20.1
forge_version=47.1.1

# Used for nightly and dev build identification
mod_version_series=6.3

# SkyTekx: the version of this unofficial build. Keep it in the 6.x series and >= 6.2.18 (the release
# this fork is based on); bump the -skytekx.N suffix for every jar that goes into local-mods/
mod_version=6.3.0-skytekx.1

# Version ranges for mods.toml
minecraft_version_range=[1.20.1]
loader_version_range=[47,)
forge_version_range=[47.1.1,)

# Mappings
# ==== Possible options ====
# Sugarcane: mappings_channel=sugarcane, mappings_version=yyyy.mm.dd
# Parchment: mappings_channel=parchment, mappings_version=yyyy.mm.dd
# Old Parchment: mappings_channel=parchment_previous, mappings_version=yyyy.mm.dd, previous_minecraft_version=1.x.x
# Official: mappings_channel=official
# Other: mappings_channel=x, mappings_version=y
mappings_channel=sugarcane
mappings_version=2023.07.23

# Dependencies
registrate_version=MC1.20-1.3.3
registrate_version_range=[MC1.20-1.3.3,)
# SkyTekx: the Registrate jar that jarJar bundles (the same one as in the 6.2.18-beta release jar)
registrate_jarjar_version=MC1.20-1.3.11
jei_version=15.2.0.22

graphlib_version=3.0.4
graphlib_version_range=[3.0.4,3.1)
# SkyTekx: the GraphLib3 jar that jarJar bundles (the same one as in the 6.2.18-beta release jar)
graphlib_jarjar_version=3.0.7
ae2_version=15.0.3-alpha
rs_version=1.12.4
#top_version=5.0.0
top_version=1.20.0-10.0.0
patchouli_version=1.19.3-78
mekanism_version=10.4.8.43
jade_cf_id=4614153
ench_desc_version=17.0.3
bookshelf_version=20.0.2
almostunified_version=0.6.0
cctVersion=1.111.0
# SkyTekx: Curios for the optional charm slot support, the version that the pack ships
curios_version=5.14.1+1.20.1

