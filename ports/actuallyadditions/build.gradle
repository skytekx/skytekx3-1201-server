jar {
    group = 'artifact'
    // SkyTekx: byte-reproducible jar (no file timestamps, fixed entry order, no build timestamp in
    // the manifest), so a rebuild of the same commit can be checked against the SHA-1 recorded in
    // modrinth-permissions/
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    // SkyTekx: MIT asks for the license text in every copy, and upstream jars carry none. The
    // NOTICE says that this is a modified, unofficial build and where its source is
    from('LICENSE') {
        rename { "LICENSE_actuallyadditions" }
    }
    from('NOTICE') {
        rename { "NOTICE_actuallyadditions" }
    }
    manifest {
        attributes(["Specification-Title"     : "Actually Additions",
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.archivesBaseName,
                    "Implementation-Version"  : project.version,
                    "Implementation-Vendor"   : "Actually Additions (modified build: SkyTekx)",
                    "MixinConfigs"            : "actuallyadditions.mixins.json"],)
    }

    from sourceSets.main.output
}

task deobfJar(type: Jar) {
    from sourceSets.main.output
    from sourceSets.main.java
    archiveClassifier.set('dev')
}

task apiJar(type: Jar) {
    from sourceSets.main.output
    from sourceSets.main.java
    archiveClassifier.set('api')
    include 'de/ellpeck/actuallyadditions/api/**'
}

javadoc {
    include 'de/ellpeck/actuallyadditions/api/**'
    // SkyTekx: the API sources carry a UTF-8 copyright sign, and javadoc otherwise reads them in
    // the platform charset, which fails the build on a host whose locale is not UTF-8
    options.encoding = 'UTF-8'
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    from 'build/docs/javadoc'
    archiveClassifier.set('javadoc')
}

task sourcesJar(type: Jar) {
    from sourceSets.main.java
    archiveClassifier.set('sources')
}

artifacts {
    archives deobfJar, sourcesJar, apiJar, javadocJar
}

publishing {
    tasks.publish.dependsOn build
    publications {
        mavenJava(MavenPublication) {
            groupId = group
            artifactId = base.archivesName.get()
            version = version

            from components.java

            artifact deobfJar
            artifact sourcesJar
            artifact apiJar
            artifact javadocJar

            pom.withXml {
                def node = asNode()
                if (node.dependencies.size() > 0)
                    node.remove(node.dependencies)
            }
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
