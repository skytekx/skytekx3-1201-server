# SkyTekx3 RCON guard for pf on macOS, loaded into the anchor com.apple/250.skytekx.
# RCON (TCP 65535) answers on loopback only. The game port 25565 is not touched.
# Only new connections (SYN without ACK) are dropped. macOS also uses 65535 as the local port of its own
# outgoing connections (ports 49152 to 65535), and the replies to those must still come in.
pass in quick on lo0 proto tcp from any to any port 65535
block drop in quick proto tcp from any to any port 65535 flags S/SA
